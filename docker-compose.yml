version: '3.8'

services:
  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: prepost-backend
    ports:
      - "5000:5000"
    environment:
      # Database
      - DATABASE_URL=${DATABASE_URL:-mssql+pyodbc://host.docker.internal/prepost_analytics?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes}
      
      # JWT
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      
      # YouTube API
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      
      # Google OAuth
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      
      # ML Models
      - MODEL_PATH=./app/ml/models
    volumes:
      - ./backend:/app
      - ./backend/app/ml/models:/app/app/ml/models
    networks:
      - prepost-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: prepost-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - prepost-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  prepost-network:
    driver: bridge

volumes:
  ml-models:
    driver: local
