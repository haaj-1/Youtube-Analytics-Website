version: '3.8'

services:
  # Backend API Service (Development)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: prepost-backend-dev
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-mssql+pyodbc://host.docker.internal/prepost_analytics?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - MODEL_PATH=./app/ml/models
    volumes:
      # Mount source code for hot reload
      - ./backend:/app
      - ./backend/app/ml/models:/app/app/ml/models
    networks:
      - prepost-network
    restart: unless-stopped
    command: python run.py

  # Frontend Service (Development with Vite dev server)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: prepost-frontend-dev
    ports:
      - "5173:5173"
    environment:
      - VITE_ML_API_URL=http://localhost:5000
    volumes:
      # Mount source code for hot reload
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - prepost-network
    restart: unless-stopped

networks:
  prepost-network:
    driver: bridge
